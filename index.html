<!DOCTYPE html>
<html>
<head>
  <title>Matchbox</title>
  <script>
    var userAgent = navigator.userAgent || navigator.vendor || window.opera;

    // Android → Play Store
    if (/android/i.test(userAgent)) {
      window.location.href = "https://play.google.com/store/apps/details?id=com.jio.myjio&pcampaignid=web_share";
    }
    // iOS → App Store
    else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.href = "https://play.google.com/store/apps/details?id=com.jio.myjio&pcampaignid=web_share";
    }
    // Other → normal website or nothing
    else {
      document.body.innerHTML = "<h2>App not installed</h2>";
    }
  </script>
</head>
<body>
</body>
</html>
