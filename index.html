<script>
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get("redirect");

  if (redirect) {
    const finalUrl = "https://jemishkalsariya.github.io" + redirect;

    // Try to open app (App Link)
    window.location.href = finalUrl;

    // Fallback to Play Store
    setTimeout(() => {
      window.location.href =
        "https://play.google.com/store/apps/details?id=com.freereels.app";
    }, 1500);
  }
</script>
