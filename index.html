<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening app...</title>
</head>
<body>
<script>
  var params = new URLSearchParams(window.location.search);
  var redirect = params.get("redirect");

  if (redirect) {
    var appUrl = "https://jemishkalsariya.github.io" + redirect;

    // App Link try
    window.location.href = appUrl;

    // Fallback Play Store
    setTimeout(function() {
      window.location.href =
        "https://play.google.com/store/apps/details?id=com.freereels.app";
    }, 1500);
  }
</script>
</body>
</html>
