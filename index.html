<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening app...</title>
</head>
<body>
<script>
  var params = new URLSearchParams(window.location.search);
  var redirect = params.get("redirect");

  if (redirect && redirect.indexOf('404') === -1) {
    var videoParam = redirect.split('?video=')[1];
    
    if (videoParam) {
      var appUrl = "https://jemishkalsariya.github.io" + redirect;
      // var storeUrl = "https://play.google.com/store/apps/details?id=com.freereels.app";
      var storeUrl = "https://play.google.com/store/apps/details?id=com.freereels.app&referrer=" + encodeURIComponent(videoParam);

      // hidden iframe trick — page navigate નથી થઈ જતું
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = appUrl;
      document.body.appendChild(iframe);

      // Play Store fallback
      setTimeout(function() {
        window.location.href = storeUrl;
      }, 2000);

      
    }
  }
</script>
</body>
</html>
