<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
</head>
<body>
<script>
  var path = window.location.pathname + window.location.search;
  
  if (path.indexOf('404') === -1) {
    window.location.replace("/?redirect=" + encodeURIComponent(path));
  } else {
    window.location.replace("/");
  }

  
</script>
</body>
</html>
